# Toss Open API 고정 IP 리버스 프록시 — ADR-0053 참고.
# 오라클 VM의 /etc/nginx/sites-available/toss-proxy 에 그대로 배치한다.
# 실제 시크릿 값은 이 파일에 넣지 않고, 아래 include로 분리된
# /etc/nginx/snippets/toss-proxy-secret.conf (git 밖, VM에만 존재)에 넣는다.
# /etc/nginx/conf.d/ 에 두지 말 것 — Debian/Ubuntu 기본 nginx.conf가 그 디렉토리를
# http {} 블록에서 자동으로 include하는데, "set" 지시자는 server {} 안에서만
# 허용되므로 conf.d에 두면 "set directive is not allowed here" 에러가 난다
# (직접 겪은 문제 — server 블록 안에서만 명시적으로 include되는 snippets/를 쓴다).
# 만드는 방법은 toss-proxy-secret.conf.example 참고.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name REPLACE_WITH_DUCKDNS_SUBDOMAIN; # 예: myname.duckdns.org

    ssl_certificate     /etc/letsencrypt/live/REPLACE_WITH_DUCKDNS_SUBDOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_DUCKDNS_SUBDOMAIN/privkey.pem;

    include /etc/nginx/snippets/toss-proxy-secret.conf;

    location / {
        # 앱이 보낸 시크릿 헤더가 일치하지 않으면 거부 — 이 프록시는
        # 인바운드 소스 IP를 제한할 수 없어서(Vercel IP가 유동적) 이 헤더가
        # 유일한 인증 수단이다.
        if ($http_x_toss_proxy_secret != $toss_proxy_secret) {
            return 403;
        }

        # trailing slash 없이 그대로 넘겨서 들어온 경로
        # (/oauth2/token, /api/v1/prices, /api/v1/exchange-rate 등)가
        # 전부 미러링되도록 한다 — Toss가 엔드포인트를 추가해도 이 설정은 안 바뀐다.
        proxy_pass https://openapi.tossinvest.com;
        proxy_ssl_server_name on;
        proxy_set_header Host openapi.tossinvest.com;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_DUCKDNS_SUBDOMAIN;

    # certbot의 HTTP-01 인증 및 인증서 갱신용. 그 외 평문 요청은 안 받는다.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 404;
    }
}
